<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>LCOS</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI Variable", "Microsoft YaHei UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: grid; place-items: center; background: transparent; color: #302d38; user-select: none; }
    .shell { width: 416px; min-height: 278px; padding: 34px 36px 26px; border: 1px solid rgba(74,65,91,.12); border-radius: 28px; background: linear-gradient(145deg,rgba(255,255,255,.97),rgba(247,245,250,.94)); box-shadow: 0 26px 70px rgba(43,36,55,.18), inset 0 1px 0 #fff; display: flex; flex-direction: column; align-items: center; -webkit-app-region: drag; }
    .glyph { --ink: 87,69,137; position: relative; width: 76px; height: 76px; margin: 8px 0 24px; filter: drop-shadow(0 10px 18px rgba(var(--ink),.15)); }
    .core { position: absolute; inset: 21px; border-radius: 11px; border: 1px solid rgba(var(--ink),.48); background: linear-gradient(145deg,#fff,rgba(var(--ink),.11)); display: flex; align-items: center; justify-content: center; gap: 4px; animation: breathe 2.2s ease-in-out infinite; }
    .core i { width: 3px; height: 13px; border-radius: 4px; background: rgba(var(--ink),.78); }
    .segment { position: absolute; border-radius: 999px; background: rgba(var(--ink),.62); box-shadow: 0 0 12px rgba(var(--ink),.12); }
    .top,.bottom { width: 26px; height: 6px; left: 25px; }
    .left,.right { width: 6px; height: 26px; top: 25px; }
    .top { top: 4px; animation: top 1.8s ease-in-out infinite; } .right { right: 4px; animation: right 1.8s .18s ease-in-out infinite; }
    .bottom { bottom: 4px; animation: bottom 1.8s .36s ease-in-out infinite; } .left { left: 4px; animation: left 1.8s .54s ease-in-out infinite; }
    h1 { margin: 0 0 8px; font-size: 18px; font-weight: 620; letter-spacing: .02em; }
    .status { min-height: 22px; color: #77717f; font-size: 13px; }
    .track { width: 220px; height: 2px; margin-top: 18px; overflow: hidden; border-radius: 99px; background: rgba(87,69,137,.09); }
    .fill { width: 6%; height: 100%; border-radius: inherit; background: linear-gradient(90deg,#7763a6,#9a80c7); transition: width 420ms cubic-bezier(.2,.8,.2,1); }
    .wait { height: 17px; margin-top: 10px; color: #9a949f; font-size: 11px; opacity: 0; transition: opacity 180ms; }
    .wait.visible { opacity: 1; }
    .error-detail { display: none; width: 100%; max-height: 68px; margin-top: 12px; padding: 9px 11px; overflow: auto; border-radius: 10px; background: rgba(174,65,62,.06); color: #84514f; font: 11px/1.45 "Cascadia Code", monospace; user-select: text; -webkit-app-region: no-drag; }
    .actions { display: none; gap: 8px; margin-top: 14px; -webkit-app-region: no-drag; }
    button { padding: 7px 12px; border: 1px solid rgba(70,62,80,.12); border-radius: 10px; background: rgba(255,255,255,.78); color: #514b58; font: inherit; cursor: pointer; }
    .error .glyph { --ink: 177,78,75; }
    .error .top { transform: rotate(38deg) translate(5px,3px); animation: none; }
    .error .bottom { transform: rotate(-38deg) translate(5px,-3px); animation: none; }
    .error .left,.error .right { opacity: .22; animation: none; }
    .error .core { animation: none; }
    .error .error-detail { display: block; }
    .error .actions { display: flex; }
    .error .track,.error .wait { display: none; }
    @keyframes breathe { 50% { transform: scale(1.06); } }
    @keyframes top { 50% { transform: translateY(-5px); opacity:.34; } }
    @keyframes right { 50% { transform: translateX(5px); opacity:.34; } }
    @keyframes bottom { 50% { transform: translateY(5px); opacity:.34; } }
    @keyframes left { 50% { transform: translateX(-5px); opacity:.34; } }
    @media (prefers-reduced-motion: reduce) { *,::before,::after { animation: none !important; transition-duration: 0ms !important; } }
  </style>
</head>
<body>
  <main class="shell" aria-live="polite">
    <div class="glyph" aria-hidden="true"><span class="segment top"></span><span class="segment right"></span><span class="segment bottom"></span><span class="segment left"></span><span class="core"><i></i><i></i></span></div>
    <h1>LCOS</h1>
    <div class="status">正在准备启动</div>
    <div class="track"><div class="fill"></div></div>
    <div class="wait"></div>
    <div class="error-detail"></div>
    <div class="actions"><button id="logs">打开日志</button><button id="quit">退出</button></div>
  </main>
  <script>
    const shell = document.querySelector('.shell')
    const status = document.querySelector('.status')
    const fill = document.querySelector('.fill')
    const wait = document.querySelector('.wait')
    const detail = document.querySelector('.error-detail')
    const startedAt = Date.now()
    let lastUpdate = Date.now()
    window.lcosBoot?.onStatus((value) => {
      lastUpdate = Date.now()
      shell.classList.toggle('error', value?.state === 'error')
      status.textContent = value?.label || '正在准备启动'
      fill.style.width = `${Math.max(3, Math.min(100, Number(value?.progress) || 3))}%`
      detail.textContent = value?.detail || ''
    })
    setInterval(() => {
      if (shell.classList.contains('error')) return
      const total = Math.floor((Date.now() - startedAt) / 1000)
      const quiet = Math.floor((Date.now() - lastUpdate) / 1000)
      wait.classList.toggle('visible', quiet >= 8)
      wait.textContent = quiet >= 8 ? `仍在等待当前步骤 · ${total}s` : ''
    }, 1000)
    document.querySelector('#logs').addEventListener('click', () => window.lcosBoot?.openLogs())
    document.querySelector('#quit').addEventListener('click', () => window.lcosBoot?.quit())
  </script>
</body>
</html>
