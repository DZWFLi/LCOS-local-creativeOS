<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>LCOS</title>
  <style>
    /* 冻结动效字面量（本文件走 file: 协议无法引用 token CSS，故用字面量，必须等于 A-2a 冻结值）：
       normal = 300ms · morph = 350ms · ease-apple = cubic-bezier(.25,.46,.45,.94)
       例外：交互反馈 100ms（游戏 GUI 裁决 §2.2）。 */
    :root { color-scheme: light; font-family: "Segoe UI Variable", "Microsoft YaHei UI", sans-serif; }
    * { box-sizing: border-box; }

    /* ============ 透明窗直接承载内容：无卡壳、无边框、无投影，全窗可拖 ============ */
    body { margin: 0; height: 100vh; display: grid; place-items: center; background: transparent; color: #f6f3f9; user-select: none; -webkit-app-region: drag; }

    .shell { display: flex; flex-direction: column; align-items: center; padding: 8px 24px;
      /* ready → Project Launcher 统一 morph/fade 预留（冻结值 morph 350ms + ease-apple）。
         当前 main.mjs 在 ready 后直接 close 本窗、无人挂载 .ready，此过渡处于休眠态；
         未来在 onStatus 里 toggle 'ready' 后即生效——勿删。 */
      transition: opacity 350ms cubic-bezier(.25,.46,.45,.94), transform 350ms cubic-bezier(.25,.46,.45,.94); }
    .shell.ready { opacity: 0; transform: scale(.96); }

    /* ============ Glyph：bloub 引擎语言（黑色实心 squircle + 白色双眼胶囊） ============
       形态全部派生自 web 仓 bloub 引擎，不自行再造：
       · 身体 = superellipseProfile(n=4)（shape.ts 超椭圆，squircle 轮廓），R=42，viewBox 100，48 采样点；
       · 双眼 = face.ts 常数正交投影：REST_GAZE(yaw 28.49°, pitch 28.62°, roll −13°) + EYE_SPLIT 15.46°，
         EYE_W .186 / EYE_H .412（球半径单位）→ 左眼 matrix(.8876,−.31783,.41996,.85588) @(57.96,32.86)，
         右眼 matrix(.66414,−.06303,.41996,.85588) @(75.98,28.44)（右眼更窄 = 球面透视，深度 0.595）；
       · 眨眼 = 屏幕系竖向压扁至 0.06（face.ts blinkScale），单次 180ms（81ms 闭 / 99ms 开），
         节拍取引擎区间上限 4.6s，首拍延迟 1.4s（face.ts BLINKS 日历首拍）；
       · 呼吸 = 周期 3.4s（引擎 breath 常数，≥2.4s 冻结下限），幅度 1↔1.03，ease-in-out。 */
    .glyph { position: relative; width: 84px; height: 84px;
      filter: drop-shadow(0 10px 22px rgba(23,18,31,.25)) drop-shadow(0 0 1px rgba(255,255,255,.25)); /* 轻投影=悬浮因果；1px 亮边=深色壁纸上的轮廓保底，非发光 */
      animation: breathe 3.4s ease-in-out infinite; }
    .glyph svg { display: block; width: 100%; height: 100%; }
    .glyph .body { fill: #1d1626; transition: fill 300ms cubic-bezier(.25,.46,.45,.94); } /* 深墨身体系（施工单冻结） */
    .glyph .eye rect { fill: #fff; }
    .glyph .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.6s 1.4s ease-in-out infinite; }
    .glyph .eye-x { display: none; }
    .glyph .eye-x path { stroke: #fff; stroke-width: 3.2; stroke-linecap: round; }

    /* error：身体转错误冻结色（= --lcos-glyth-error rgb(180,76,73)），呼吸停（静止即警报），
       胶囊眼换 × 眼（施工单允许的两态之一），位置原地不变 */
    .error .glyph { animation: none; }
    .error .glyph .body { fill: #b44c49; }
    .error .glyph .eye { display: none; }
    .error .glyph .eye-x { display: block; }

    /* ============ 三件套：glyph 居中 + 极简状态行 + 极细进度 ============ */
    .status-row { display: flex; align-items: baseline; gap: 10px; min-height: 22px; margin-top: 12px; }
    .brand { font-size: 12px; font-weight: 600; letter-spacing: .34em; color: rgba(238,233,244,.62); } /* LCOS 字标降权：12px 宽字距浅灰前缀 */
    .status { font-size: 13px; color: #f6f3f9; }
    /* 文字三保底：透明窗无底板，白字自带双层深色投影（紧投影保形 + 柔投影保读），任意壁纸可读 */
    .status-row, .wait { text-shadow: 0 1px 2px rgba(23,18,31,.55), 0 0 12px rgba(23,18,31,.3); }

    .track { width: 180px; height: 2px; margin-top: 12px; overflow: hidden; border-radius: 99px; background: rgba(29,22,38,.18); }
    .fill { width: 6%; height: 100%; border-radius: inherit; background: #9a80c7; /* 原 splash 紫系中明度端点，深浅壁纸均可读 */
      transition: width 300ms cubic-bezier(.25,.46,.45,.94); } /* normal 冻结值 */

    .wait { height: 17px; margin-top: 8px; color: rgba(238,233,244,.55); font-size: 11px; opacity: 0; transition: opacity 300ms cubic-bezier(.25,.46,.45,.94); }
    .wait.visible { opacity: 1; }

    /* ============ error 态才允许扩出的 Apple alert-like 轻 surface ============ */
    .error-panel { display: none; flex-direction: column; align-items: stretch; width: 320px; max-width: calc(100vw - 48px); margin-top: 12px; padding: 12px 14px; border: 1px solid rgba(74,65,91,.1); border-radius: 14px; background: rgba(251,250,253,.94); box-shadow: 0 16px 44px rgba(43,36,55,.22); -webkit-app-region: no-drag; }
    .error-detail { max-height: 68px; overflow: auto; padding: 9px 11px; border-radius: 10px; background: rgba(174,65,62,.07); color: #84514f; font: 11px/1.45 "Cascadia Code", monospace; user-select: text; }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    button { padding: 6px 14px; border: 1px solid rgba(74,65,91,.1); border-radius: 9px; background: rgba(255,255,255,.72); color: #514b58; font-family: inherit; font-size: 12px; cursor: pointer; transition: background-color 100ms, border-color 100ms, transform 100ms; } /* 半透明玻璃底轻按钮；反馈 100ms（§2.2） */
    button:hover { background: rgba(255,255,255,.95); }
    button:active { transform: scale(.97); }

    .error .error-panel { display: flex; animation: panel-in 300ms cubic-bezier(.25,.46,.45,.94); } /* 因果：错误出现才动 */
    .error .track, .error .wait { display: none; }

    @keyframes breathe { 50% { transform: scale(1.03); } } /* 3.4s ≥ 2.4s 冻结下限 */
    @keyframes blink { 0%, 3.91%, 100% { transform: scaleY(1); } 1.76% { transform: scaleY(.06); } } /* 4.6s 拍内的 180ms 眨眼：81ms 处全闭（1.76%）、180ms 处睁开（3.91%） */
    @keyframes panel-in { from { opacity: 0; transform: translateY(6px); } }
    @media (prefers-reduced-motion: reduce) { *,::before,::after { animation: none !important; transition-duration: 0ms !important; } } /* 呼吸/眨眼/面板入场全停 */
  </style>
</head>
<body>
  <main class="shell" aria-live="polite">
    <div class="glyph" aria-hidden="true">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path class="body" d="M92 50L91.82 65.17L91.28 71.37L90.37 75.98L89.09 79.7L87.41 82.77L85.32 85.32L82.77 87.41L79.7 89.09L75.98 90.37L71.37 91.28L65.17 91.82L50 92L34.83 91.82L28.63 91.28L24.02 90.37L20.3 89.09L17.23 87.41L14.68 85.32L12.59 82.77L10.91 79.7L9.63 75.98L8.72 71.37L8.18 65.17L8 50L8.18 34.83L8.72 28.63L9.63 24.02L10.91 20.3L12.59 17.23L14.68 14.68L17.23 12.59L20.3 10.91L24.02 9.63L28.63 8.72L34.83 8.18L50 8L65.17 8.18L71.37 8.72L75.98 9.63L79.7 10.91L82.77 12.59L85.32 14.68L87.41 17.23L89.09 20.3L90.37 24.02L91.28 28.63L91.82 34.83Z"/>
        <g transform="translate(57.96 32.86)"><g class="eye"><g transform="matrix(.8876 -.31783 .41996 .85588 0 0)"><rect x="-3.91" y="-8.65" width="7.81" height="17.3" rx="3.91"/></g></g></g>
        <g transform="translate(75.98 28.44)"><g class="eye"><g transform="matrix(.66414 -.06303 .41996 .85588 0 0)"><rect x="-3.91" y="-8.65" width="7.81" height="17.3" rx="3.91"/></g></g></g>
        <g class="eye-x" transform="translate(57.96 32.86)"><path d="M-4.4 -4.4L4.4 4.4M4.4 -4.4L-4.4 4.4"/></g>
        <g class="eye-x" transform="translate(75.98 28.44)"><path d="M-4.4 -4.4L4.4 4.4M4.4 -4.4L-4.4 4.4"/></g>
      </svg>
    </div>
    <div class="status-row"><span class="brand">LCOS</span><div class="status">正在准备启动</div></div>
    <div class="track"><div class="fill"></div></div>
    <div class="wait"></div>
    <div class="error-panel">
      <div class="error-detail"></div>
      <div class="actions"><button id="logs">打开日志</button><button id="quit">退出</button></div>
    </div>
  </main>
  <script>
    const shell = document.querySelector('.shell')
    const status = document.querySelector('.status')
    const fill = document.querySelector('.fill')
    const wait = document.querySelector('.wait')
    const detail = document.querySelector('.error-detail')
    const startedAt = Date.now()
    let lastUpdate = Date.now()
    window.lcosBoot?.onStatus((value) => {
      lastUpdate = Date.now()
      shell.classList.toggle('error', value?.state === 'error')
      status.textContent = value?.label || '正在准备启动'
      fill.style.width = `${Math.max(3, Math.min(100, Number(value?.progress) || 3))}%`
      detail.textContent = value?.detail || ''
    })
    setInterval(() => {
      if (shell.classList.contains('error')) return
      const total = Math.floor((Date.now() - startedAt) / 1000)
      const quiet = Math.floor((Date.now() - lastUpdate) / 1000)
      wait.classList.toggle('visible', quiet >= 8)
      wait.textContent = quiet >= 8 ? `仍在等待当前步骤 · ${total}s` : ''
    }, 1000)
    document.querySelector('#logs').addEventListener('click', () => window.lcosBoot?.openLogs())
    document.querySelector('#quit').addEventListener('click', () => window.lcosBoot?.quit())
  </script>
</body>
</html>
